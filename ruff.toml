target-version = "py311"

# 🔴 **100 → 120 (2026-08-16)**. ruff 는 글자수가 아니라 **표시 너비**로 세고
# **한글은 2칸**이다 — 100칸은 한글 **50자**뿐이라 문서가 빽빽한 이 프로젝트엔 불가능한 상한이었다.
# 실측: 원시 글자수 100 초과는 **10줄**인데 ruff 는 **48건**을 냈다. 100은 템플릿 기본값이지
# 이 프로젝트가 고른 값이 아니었다. 120 에서 남는 10줄은 실제로 긴 줄이라 손으로 정리했다.
line-length = 120
src = ["src", "app", "."]

[lint]
# ⚠️ `PTH` 제외 — `os.path` → `pathlib` **이주 권고**다(35건). 이 프로젝트는
#    **매 평일 08:40 에 실제로 도는 잡**인데 회귀 테스트가 `test_auction_gate.py` 46건
#    (동시호가 게이트)뿐이라 나머지 호출부는 무방비다. 얻는 것이 스타일뿐인 변경에
#    라이브를 걸 이유가 없다.
#    🔴 **부채로 남긴 것이지 «틀렸다»가 아니다** — 회귀 테스트가 갖춰지면 그때 이주한다.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG", "RUF"]
# RUF001/002/003 = «혼동하기 쉬운 유니코드». **한글 프로젝트에서는 오탐이다** —
# 실측(2026-08-16): 31건 전부 문서·주석의 `×`(곱셈기호)였다. 의도해서 쓴 글자이고
# `x` 로 바꾸면 오히려 읽기 나빠진다. 영문 코드베이스를 전제한 규칙이라 끈다.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.isort]
known-first-party = ["app", "src"]

[format]
quote-style = "double"
